<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربحي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap');
:root{
  --bg:#FAF6EE; --surface:#FFFFFF; --ink:#1E2A22; --muted:#8A8574;
  --green:#0B6E4F; --greenDark:#084D38; --gold:#E0A02E; --goldSoft:#F6E4BE;
  --line:#EAE3D2; --danger:#B3432B; --earnBg:#E6F2EC; --dangerBg:#FBEAE5;
}
.splash-logo{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);}
.disp{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
svg.ic{display:block;flex-shrink:0;}

.page{min-height:100vh;display:flex;background:var(--bg);flex-direction:column;}
.phone{width:100%;min-height:100vh;background:var(--surface);position:relative;display:flex;flex-direction:column;flex:1;}
.admin-phone{max-width:760px;margin:0 auto;width:100%;}

.head-green{background:var(--green);padding:44px 28px 34px;color:#fff;text-align:center;}
.head-ink{background:var(--ink);padding:44px 28px 34px;color:#fff;text-align:center;}
.head-icon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}

.form-body{padding:26px 26px 20px;flex:1;}
.pill-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:22px;}
.pill{flex:1;border:none;border-radius:9px;padding:9px 0;background:transparent;font-size:13.5px;font-weight:700;color:var(--muted);}
.pill.active{background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,0.08);color:var(--green);}
.field{margin-bottom:14px;}
.field label{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.field input,.field select{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:#fff;color:var(--ink);outline:none;font-family:'Tajawal',sans-serif;}
.field input:focus{border-color:var(--green);}
.err{color:var(--danger);font-size:12.5px;margin-top:4px;}
.primary-btn{width:100%;margin-top:18px;padding:14px 0;border-radius:14px;border:none;background:var(--ink);color:#fff;font-size:14.5px;font-weight:700;}
.primary-btn:disabled{opacity:0.6;}
.small-note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;}
.admin-link-btn{border:none;background:transparent;padding:12px 0 18px;color:var(--muted);font-size:11.5px;text-decoration:underline;width:100%;}

.app-header{background:var(--green);padding:14px 20px 20px;color:#fff;}
.app-header-row{display:flex;justify-content:space-between;align-items:center;}
.balance-pill{background:rgba(255,255,255,0.15);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:13px;}

.tab-content{flex:1;overflow-y:auto;position:relative;padding-bottom:6px;}
.tabpad{padding:26px 20px 20px;}

.balance-hero{text-align:center;margin-bottom:22px;}
.balance-hero .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.balance-hero .num{font-size:40px;font-weight:800;}
.balance-hero .num span{font-size:15px;color:var(--muted);font-weight:500;}
.balance-hero .dzd{font-size:12px;color:var(--muted);margin-top:4px;}
.watch-card{width:100%;border:none;border-radius:20px;padding:22px 18px;display:flex;align-items:center;justify-content:space-between;color:#fff;}
.watch-card.can{background:linear-gradient(135deg,var(--green),var(--greenDark));box-shadow:0 14px 28px -12px rgba(11,110,79,0.55);}
.watch-card.cant{background:var(--line);color:var(--muted);}
.watch-title{font-size:17px;font-weight:700;margin-bottom:2px;}
.watch-sub{font-size:12.5px;opacity:0.85;}
.limit-box{margin-top:16px;background:var(--goldSoft);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#6B5219;}
.guide-box{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.guide-title{font-size:13px;font-weight:700;margin-bottom:8px;}
.guide-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
.guide-row:last-child{border-bottom:none;}
.guide-row span:first-child{color:var(--muted);}
.guide-row span:last-child{font-weight:600;}

.wheel-wrap{padding:24px 20px;}
.wheel-outer{position:relative;width:200px;height:200px;margin:0 auto 20px;}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--ink);z-index:2;}
.wheel-disc{width:100%;height:100%;border-radius:50%;border:6px solid var(--ink);position:relative;overflow:hidden;transition:none;}
.wheel-disc.spinning{transition:transform 3.1s cubic-bezier(0.17,0.67,0.2,1);}
.wheel-label{position:absolute;top:-74px;left:-12px;width:24px;text-align:center;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,0.35);}
.wheel-btn{width:100%;border:none;border-radius:16px;padding:14px 0;font-size:14.5px;font-weight:700;}
.games-grid{padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.game-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px 14px;text-align:center;transition:transform .15s;box-shadow:0 4px 14px -8px rgba(30,42,34,0.15);}
.game-card:active{transform:scale(0.96);}
.game-card .gi{width:52px;height:52px;border-radius:14px;background:var(--earnBg);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.game-name{font-size:14.5px;font-weight:700;}
.game-reward{font-size:12px;color:var(--gold);margin-top:4px;font-weight:700;}
.section-lbl2{padding:4px 20px 8px;font-size:13px;font-weight:700;color:var(--muted);}

.tx-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);}
.tx-left{display:flex;align-items:center;gap:12px;}
.tx-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.tx-name{font-size:13.5px;font-weight:500;}
.tx-date{font-size:11.5px;color:var(--muted);margin-top:1px;}
.tx-amt{font-size:14px;font-weight:700;}

.method-row2{display:flex;gap:10px;margin-bottom:20px;}
.method-card{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);}
.method-card.active{border-color:var(--green);background:var(--earnBg);color:var(--greenDark);}
.method-title{font-size:13px;font-weight:700;}
.method-sub{font-size:10.5px;color:var(--muted);}
.op-row{display:flex;gap:8px;margin-bottom:4px;}
.op-btn{flex:1;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:500;}
.op-btn.active{border-color:var(--green);background:var(--earnBg);color:var(--greenDark);font-weight:700;}

.bottomnav{display:flex;border-top:1px solid var(--line);background:var(--surface);}
.navbtn{flex:1;border:none;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;}
.navbtn.active{color:var(--green);font-weight:700;}

.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 25px -8px rgba(0,0,0,0.4);white-space:nowrap;z-index:30;}

.watch-overlay{position:absolute;inset:0;background:rgba(10,14,11,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px;z-index:20;padding:24px;}
.ad-badge{background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;padding:6px 16px;border-radius:999px;}
.ad-progress{width:200px;height:6px;background:rgba(255,255,255,0.15);border-radius:999px;margin-top:20px;overflow:hidden;}
.ad-progress-fill{height:100%;background:var(--gold);border-radius:999px;animation:adfill 5s linear forwards;width:0;}
@keyframes adfill{to{width:100%;}}

.blocked-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center;background:#1B1210;color:#fff;}
.blocked-icon{width:70px;height:70px;border-radius:50%;background:rgba(179,67,43,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}

.admin-top{background:var(--ink);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;}
.admin-body{padding:20px 24px;max-width:720px;margin:0 auto;}
.stat-row{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.stat-card{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.stat-lbl{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:800;}
.req-list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden;}
.req-item{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.req-item:last-child{border-bottom:none;}
.req-name{font-size:13.5px;font-weight:600;}
.req-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.badge{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
.badge.ok{color:var(--green);background:var(--earnBg);}
.badge.bad{color:var(--danger);background:var(--dangerBg);}
.mini-btn{border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
.mini-btn.ok{background:var(--earnBg);color:var(--green);}
.mini-btn.bad{background:var(--dangerBg);color:var(--danger);}
.section-lbl{font-size:15px;font-weight:700;margin-bottom:10px;}
.admin-tabs2{display:flex;gap:8px;margin-bottom:16px;}
.admin-tab2{padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13px;}
.admin-tab2.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13.5px;}

/* modal */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:40;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--surface);border-radius:24px;padding:28px 22px;width:100%;max-width:340px;text-align:center;position:relative;box-shadow:0 24px 50px -16px rgba(0,0,0,0.35);}
.modal-close{position:absolute;top:14px;left:14px;background:none;border:none;color:var(--muted);}
.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0;}
.num-btn{padding:15px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-family:'Tajawal';font-size:17px;transition:transform .1s;}
.num-btn:active{transform:scale(0.9);}
.num-btn:disabled{opacity:0.3;background:var(--line);}
.reaction-zone{position:relative;height:220px;background:var(--bg);border-radius:16px;margin:16px 0 4px;overflow:hidden;border:1.5px solid var(--line);}
.reaction-target{width:60px;height:60px;border-radius:50%;background:var(--green);position:absolute;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(11,110,79,0.5);}
.game-cooldown-icon{background:var(--goldSoft);border-radius:16px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.settings-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px;}
.settings-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.settings-label{font-size:13px;color:var(--muted);}
.settings-value{font-size:13.5px;font-weight:700;text-align:left;}


</style>
</head>
<body>
<div class="page">
  <div id="app"></div>
</div>

<script>
/* ---------- ICONS (inline SVG, no external images/emojis) ---------- */
const ICONS = {
  coin: `<circle cx="12" cy="12" r="9"/><path d="M9.5 15.2c.4.7 1.3 1.1 2.4 1.1 1.6 0 2.7-.8 2.7-2 0-1.3-1.2-1.7-2.7-2.1-1.5-.4-2.4-.9-2.4-2.1 0-1.1 1-1.9 2.4-1.9 1 0 1.9.4 2.3 1"/><path d="M12 7.2v1M12 15.8v1"/>`,
  user: `<circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c1.2-3.2 3.6-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/>`,
  mail: `<rect x="3.5" y="5.5" width="17" height="13" rx="2.2"/><path d="M4.5 7l7.5 6 7.5-6"/>`,
  lock: `<rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>`,
  shield: `<path d="M12 3.5l7 2.6v5.4c0 4.6-3 8-7 9.4-4-1.4-7-4.8-7-9.4V6.1l7-2.6z"/><path d="M9 12l2 2 4-4.2"/>`,
  home: `<path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/>`,
  gamepad: `<rect x="3" y="8" width="18" height="9.5" rx="4.5"/><path d="M8 10.7v4M6 12.7h4"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="14" r="1"/>`,
  wallet: `<rect x="3.5" y="6.5" width="17" height="12.5" rx="2.5"/><path d="M3.5 10.5h17"/><circle cx="16.5" cy="14.5" r="1.2"/>`,
  arrowDown: `<path d="M12 4.5v13"/><path d="M6.5 12l5.5 5.5L17.5 12"/>`,
  play: `<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5v-7z"/>`,
  check: `<path d="M5 13l4.5 4.5L19.5 7"/>`,
  clock: `<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.3 2"/>`,
  phone: `<rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 18h2"/>`,
  bank: `<path d="M4 10.5L12 5l8 5.5"/><path d="M5.5 10.5v8M9.5 10.5v8M14.5 10.5v8M18.5 10.5v8"/><path d="M4 19h16"/>`,
  alert: `<path d="M12 4.5l9 15.5H3l9-15.5z"/><path d="M12 10.5v4"/><circle cx="12" cy="17" r="0.4" fill="currentColor" stroke="none"/>`,
  x: `<path d="M6 6l12 12M18 6L6 18"/>`,
  logout: `<path d="M9 5H6.5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2H9"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/>`,
  target: `<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>`,
  bolt: `<path d="M12.5 3.5L5 13.5h5.5L11 20.5l7.5-11H13z"/>`,
  gear: `<path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/><path d="M19.4 13.6l.1-1.6-.1-1.6 2-1.5-1.8-3-2.2 1a7.4 7.4 0 0 0-2.7-1.6L14.4 3h-3.5l-.3 2.3c-1 .2-1.9.8-2.7 1.6l-2.2-1-1.8 3 2 1.5-.1 1.6.1 1.6-2 1.5 1.8 3 2.2-1c.8.8 1.7 1.4 2.7 1.6l.3 2.3h3.5l.3-2.3c1-.2 1.9-.8 2.7-1.6l2.2 1 1.8-3-2-1.5z"/>`,
};
function icon(name, size=18, color='currentColor', stroke=1.8){
  const body = ICONS[name] || '';
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

const DAILY_LIMIT = 20;
const POINTS_PER_AD = 10;
const POINT_VALUE_DZD = 0.01;
const MIN_WITHDRAW = 5000;
const OPERATORS = ["موبيليس","جيزي","أوريدو"];
const ADMIN_EMAIL = "admin@rebhi.dz";
const API_BASE = 'https://rebhi-server.onrender.com/api';
let authToken = localStorage.getItem('rebhi_token') || null;
const WHEEL_PRIZES = [5,0,20,10,5,50,0,15];
const GAME_COOLDOWN_MS = 30000;

let state = { screen:'auth', authMode:'login', user:null, transactions:[], withdrawals:[], adminData:null, adminTab:'withdrawals', loading:true, tab:'home', toast:null, watching:false, countdown:5 };

function todayStr(){ return new Date().toDateString(); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ar-DZ',{day:'numeric',month:'short'}); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ar-DZ',{hour:'2-digit',minute:'2-digit'}); }

async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if(authToken) headers['Authorization'] = 'Bearer '+authToken;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 90000);
  try{
    const res = await fetch(API_BASE+path, { ...opts, headers, signal: controller.signal });
    clearTimeout(timer);
    let body = null;
    try{ body = await res.json(); }catch(e){}
    if(!res.ok){
      const err = new Error((body && body.error) || 'حدث خطأ');
      err.status = res.status;
      throw err;
    }
    return body;
  }catch(e){
    clearTimeout(timer);
    if(e.name === 'AbortError') throw new Error('السيرفر يستجيق الآن، أعد المحاولة خلال ثوانٍ');
    throw e;
  }
}

function handleApiErr(e, el){
  const errEl = el ? document.getElementById(el) : null;
  if(errEl) errEl.textContent = e.message;
  else showToast(e.message);
  if(e.status === 401){ authToken = null; localStorage.removeItem('rebhi_token'); state.user=null; render(); }
}

function getUser(){ return state.user; }
function canPlayGame(u){ return Date.now() - (u.lastGameAt||0) > GAME_COOLDOWN_MS; }

function showToast(text){
  state.toast = text;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--green);color:#fff;"><div class="splash-logo">${icon('coin',34,'#fff')}</div><div class="disp" style="font-size:20px;font-weight:800;">ربحي</div><div style="font-size:12.5px;opacity:0.75;">جارِ الاتصال بالسيرفر...</div></div>`; return; }
  if(state.screen === 'admin') { app.innerHTML = `<div class="phone admin-phone">${renderAdmin()}</div>`; attachAdminEvents(); return; }
  if(state.screen === 'adminAuth'){ app.innerHTML = `<div class="phone">${renderAdminAuth()}</div>`; attachAdminAuthEvents(); return; }
  if(!state.user){ app.innerHTML = `<div class="phone">${renderAuth()}</div>`; attachAuthEvents(); return; }
  const u = getUser();
  if(u.blocked){ app.innerHTML = `<div class="phone">${renderBlocked()}</div>`; attachBlockedEvents(); return; }
  app.innerHTML = `<div class="phone">${renderMainApp(u)}</div>`;
  attachMainEvents(u);
}

/* ---------- AUTH ---------- */
function renderAuth(){
  const login = state.authMode === 'login';
  return `
  <div class="head-green">
    <div class="head-icon">${icon('coin',26,'#fff')}</div>
    <div class="disp" style="font-size:24px;font-weight:800;">ربحي</div>
    <div style="font-size:13px;opacity:0.8;margin-top:4px;">شاهد إعلانات. اجمع نقاط. اسحب فلوسك.</div>
  </div>
  <div class="form-body">
    <div class="pill-tabs">
      <button class="pill ${login?'active':''}" id="pill-login">تسجيل الدخول</button>
      <button class="pill ${!login?'active':''}" id="pill-signup">حساب جديد</button>
    </div>
    ${!login? `<div class="field"><label>${icon('user',14)} الاسم الكامل</label><input id="a-name" placeholder="مثال: أمين بلحاج"></div>` : ''}
    <div class="field"><label>${icon('mail',14)} البريد الإلكتروني</label><input id="a-email" type="email" placeholder="name@example.com" dir="ltr"></div>
    <div class="field"><label>${icon('lock',14)} كلمة السر</label><input id="a-pass" type="password" placeholder="••••••••" dir="ltr"></div>

let secretTapCount = 0, secretTapTimer = null;
function attachAuthEvents(){
  document.getElementById('pill-login').onclick = ()=>{ state.authMode='login'; render(); };
  document.getElementById('pill-signup').onclick = ()=>{ state.authMode='signup'; render(); };
  document.getElementById('a-admin').onclick = ()=>{ state.screen='adminAuth'; render(); };
  // Hidden admin entry: tap the logo 5 times within 3 seconds (backup)
  const logo = document.querySelector('.head-green .head-icon');
  if(logo){
    logo.style.cursor = 'pointer';
    logo.onclick = ()=>{
      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(()=>{ secretTapCount = 0; }, 3000);
      if(secretTapCount >= 5){
        secretTapCount = 0;
        state.screen='adminAuth';
        render();
      }
    };
  }
  document.getElementById('a-submit').onclick = async ()=>{
    const email = document.getElementById('a-email').value.trim().toLowerCase();
    const pass = document.getElementById('a-pass').value;
    const err = document.getElementById('a-err');
    err.textContent = '';
    if(!email.includes('@')){ err.textContent='أدخل بريدًا إلكترونيًا صحيحًا'; return; }
    if(pass.length < 6){ err.textContent='كلمة السر يجب أن تكون 6 محارف على الأقل'; return; }
    try{
      let data;
      if(state.authMode === 'signup'){
        const name = document.getElementById('a-name').value.trim();
        if(name.length < 2){ err.textContent='أدخل اسمك الكامل'; return; }
        data = await api('/auth/signup', { method:'POST', body: JSON.stringify({ name, email, password: pass }) });
      } else {
        data = await api('/auth/login', { method:'POST', body: JSON.stringify({ email, password: pass }) });
      }
      authToken = data.token;
      localStorage.setItem('rebhi_token', authToken);
      state.user = data.user;
      await refreshMe();
      showToast(state.authMode==='signup'? 'تم إنشاء الحساب بنجاح' : 'أهلًا بك');
    }catch(e){ handleApiErr(e, 'a-err'); }
  };
}

async function refreshMe(){
  try{
    const data = await api('/user/me');
    state.user = data.user;
    state.transactions = data.transactions;
  }catch(e){
    if(e.status===401){ authToken=null; localStorage.removeItem('rebhi_token'); state.user=null; }
    else showToast(e.message);
  }
}

async function startAd(){
  const u = getUser();
  const remaining = DAILY_LIMIT - u.watchedToday;
  if(remaining <= 0 || state.watching) return;
  const startedAt = Date.now();
  // Wake the free cloud server in the background so the API call after the countdown is fast
  try{ fetch(API_BASE.replace('/api','')+'/health'); }catch(e){}
  state.watching = true; state.countdown = 5; render();
  const timer = setInterval(()=>{
    state.countdown--;
    const t = document.querySelector('.watch-overlay .ad-count-text');
    if(t) t.textContent = state.countdown;
    if(state.countdown <= 0){
      clearInterval(timer);
      finishAd(u, startedAt);
    }
  }, 1000);
}
async function finishAd(u, startedAt){
  state.watching = false;
  showToast('جارِ إضافة النقاط...');
  try{
    const data = await api('/user/ad/complete', { method:'POST', body: JSON.stringify({ startedAt }) });
    state.user = data.user;
    showToast(`ربحت ${POINTS_PER_AD} نقاط ✨`);
  }catch(e){
    // Free cloud server may still be waking up: retry once after a short pause
    if(e.message && e.message.includes('السيرفر') || e.status === 0 || !e.status){
      try{ await new Promise(r=>setTimeout(r, 4000)); const data = await api('/user/ad/complete', { method:'POST', body: JSON.stringify({ startedAt }) }); state.user = data.user; showToast(`ربحت ${POINTS_PER_AD} نقاط ✨`); return; }catch(e2){ handleApiErr(e2); }
    }
    handleApiErr(e);
  }
}
async function spinWheel(){
  const u = getUser();
  if(u.wheelSpun) return;
  const disc = document.getElementById('wheel-disc');
  const idx = Math.floor(Math.random()*WHEEL_PRIZES.length);
  const seg = 360/WHEEL_PRIZES.length;
  const center = idx*seg + seg/2;
  const target = 360*5 + (360-center);
  disc.classList.add('spinning');
  disc.style.transform = `rotate(${target}deg)`;
  document.getElementById('spin-btn').disabled = true;
  const amount = WHEEL_PRIZES[idx];
  setTimeout(async ()=>{
    try{
      const data = await api('/user/wheel', { method:'POST' });
      state.user = data.user;
      showToast(amount>0? `ربحت ${amount} نقاط من عجلة الحظ` : 'بدون ربح هالمرة، جرّب بكرة');
    }catch(e){ handleApiErr(e); }
    render();
  }, 3200);
}

  }
  const target = Math.floor(Math.random()*10)+1;
  let tries = 3;
  overlay.classList.add('active');
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="modal-close" id="mc">${icon('x',18)}</button>
      <div class="disp" style="font-weight:800;font-size:16px;">احزر الرقم بين 1 و 10</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px;" id="guess-msg">لديك ${tries} محاولات</div>
      <div class="num-grid" id="num-grid"></div>
    </div>`;
  document.getElementById('mc').onclick = ()=> overlay.classList.remove('active');
  const grid = document.getElementById('num-grid');
  for(let i=1;i<=10;i++){
    const b = document.createElement('button');
    b.className='num-btn'; b.textContent=i;
    b.onclick = async ()=>{
      tries--;
      if(i === target){
        document.getElementById('guess-msg').textContent = 'أحسنت! خمنت الرقم الصحيح';
        grid.querySelectorAll('button').forEach(x=>x.disabled=true);
        await rewardGame(5);
      } else if(tries<=0){
        document.getElementById('guess-msg').textContent = `انتهت المحاولات، الرقم كان ${target}`;
        grid.querySelectorAll('button').forEach(x=>x.disabled=true);
      } else {
        document.getElementById('guess-msg').textContent = (i<target? 'أكبر من ذلك... ':'أصغر من ذلك... ') + `لديك ${tries} محاولات`;
        b.disabled = true;
      }
    };
    grid.appendChild(b);
  }
}
function openReactionGame(){
  const u = getUser();
  const overlay = document.getElementById('modal-overlay');
  if(!canPlayGame(u)){
    overlay.classList.add('active');
    overlay.innerHTML = `<div class="modal-box"><button class="modal-close" id="mc">${icon('x',18)}</button><div class="game-cooldown-icon">${icon('clock',26,'var(--gold)')}</div><div class="disp" style="font-weight:800;margin-bottom:6px;font-size:15px;">انتظر قليلاً</div><div style="font-size:13px;color:var(--muted);line-height:1.7;">يمكنك لعب لعبة أخرى بعد ${GAME_COOLDOWN_MS/1000} ثانية لتجنب الغش</div></div>`;
    document.getElementById('mc').onclick = ()=> overlay.classList.remove('active');
    return;
  }
  let hits=0; const needed=8; let timeLeft=10;
  overlay.classList.add('active');
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="modal-close" id="mc">${icon('x',18)}</button>
      <div class="disp" style="font-weight:800;font-size:16px;">اضغط على الهدف ${needed} مرات</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">الوقت: <span id="rt">${timeLeft}</span>ث · النقاط: <span id="rh">0</span>/${needed}</div>
      <div class="reaction-zone" id="rz"><div class="reaction-target" id="rtgt" style="top:70px;right:70px;">${icon('target',24,'#fff')}</div></div>
    </div>`;
  document.getElementById('mc').onclick = ()=>{ clearInterval(countdown); overlay.classList.remove('active'); };
  const zone = document.getElementById('rz');
  const target = document.getElementById('rtgt');
  function moveTarget(){
    const zw = zone.clientWidth-56, zh = zone.clientHeight-56;
    target.style.top = Math.floor(Math.random()*zh)+'px';
    target.style.right = Math.floor(Math.random()*zw)+'px';
  }
  target.onclick = ()=>{
    hits++;
    document.getElementById('rh').textContent = hits;
    if(hits>=needed){ clearInterval(countdown); rewardGame(5); return; }
    moveTarget();
  };
  const countdown = setInterval(()=>{
    timeLeft--;
    const el = document.getElementById('rt'); if(el) el.textContent = timeLeft;
    if(timeLeft<=0){
      clearInterval(countdown);
      const box = document.querySelector('.modal-box');
      if(box) box.innerHTML = `<button class="modal-close" id="mc2">${icon('x',18)}</button><div class="disp" style="font-weight:800;">انتهى الوقت</div><div style="font-size:13px;color:var(--muted);margin-top:6px;">حاول مجدداً بعد قليل</div>`;
      const mc2 = document.getElementById('mc2'); if(mc2) mc2.onclick = ()=> overlay.classList.remove('active');
    }
  },1000);
}
async function rewardGame(amount){
  try{
    const data = await api('/user/game/reward', { method:'POST' });
    state.user = data.user;
    document.getElementById('modal-overlay').classList.remove('active');
    showToast(`ربحت ${amount} نقاط`);
    render();
  }catch(e){ handleApiErr(e); }
}

function renderBlocked(){
  return `<div class="blocked-wrap">
    <div class="blocked-icon">${icon('alert',30,'var(--danger)')}</div>
    <div class="disp" style="font-size:18px;font-weight:800;margin-bottom:8px;">تم إيقاف الحساب مؤقتًا</div>
    <div style="font-size:13px;line-height:1.8;opacity:0.6;margin-bottom:24px;">رصدنا نمط مشاهدة غير طبيعي يشبه الاستخدام الآلي (Auto-click). لحماية الحساب والمستخدمين الآخرين تم تعليق النشاط مؤقتًا لمراجعة الفريق.</div>
    <button id="blocked-logout" style="border:1px solid rgba(255,255,255,0.25);background:transparent;color:#fff;border-radius:12px;padding:11px 20px;font-size:13px;">تسجيل الخروج</button>
  </div>`;
}
function attachBlockedEvents(){
  document.getElementById('blocked-logout').onclick = ()=>{ state.user=null; render(); };
}

/* ---------- ADMIN ---------- */
let adminTab = 'withdrawals';
async function loadAdmin(){
  try{
    const stats = await api('/admin/stats');
    const withdrawals = await api('/admin/withdrawals');
    const users = await api('/admin/users');
    const filterRules = await api('/admin/filterRules');
    const audit = await api('/admin/auditLog');
    state.adminData = { stats, withdrawals, users, filterRules, audit };
    render();
  }catch(e){ handleApiErr(e); }
}
function renderAdmin(){
  const a = state.adminData || { stats:{pendingCount:0,totalPendingDzd:0,totalUsers:0}, withdrawals:[], users:[], filterRules:[], audit:[] };
  return `
  <div class="admin-top">
    <div><div class="disp" style="font-size:18px;font-weight:800;">لوحة تحكم ربحي</div><div style="font-size:11.5px;opacity:0.65;">admin@rebhi.dz</div></div>
    <button id="admin-logout" style="border:1px solid rgba(255,255,255,0.25);background:transparent;color:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;display:flex;align-items:center;gap:6px;">${icon('logout',14,'#fff')}خروج</button>
  </div>
  <div class="admin-body">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-lbl">طلبات معلّقة</div><div class="disp stat-val">${a.stats.pendingCount}</div></div>
      <div class="stat-card"><div class="stat-lbl">قيمة الطلبات المعلّقة</div><div class="disp stat-val">${a.stats.totalPendingDzd.toFixed(2)} دج</div></div>
      <div class="stat-card"><div class="stat-lbl">إجمالي المستخدمين</div><div class="disp stat-val">${a.stats.totalUsers}</div></div>
    </div>
    <div class="admin-tabs2">
      <div class="admin-tab2 ${adminTab==='withdrawals'?'active':''}" data-atab="withdrawals">طلبات السحب</div>
      <div class="admin-tab2 ${adminTab==='users'?'active':''}" data-atab="users">المستخدمون</div>
      <div class="admin-tab2 ${adminTab==='rules'?'active':''}" data-atab="rules">فلترة المحتوى</div>
    </div>
    ${adminTab==='withdrawals'? renderAdminWithdrawals(a.withdrawals)
      : adminTab==='users'? renderAdminUsers(a.users)
      : renderAdminRules(a.filterRules, a.audit)}
  </div>`;
}
function renderAdminWithdrawals(list){
  if(list.length===0) return '<div class="empty">لا توجد طلبات سحب</div>';
  return `<div class="section-lbl">طلبات السحب</div><div class="req-list">
    ${list.map(r=>`
      <div class="req-item">
        <div>
          <div class="req-name">${r.name} — ${r.method}</div>
          <div class="req-meta">${r.points.toLocaleString('ar-DZ')} نقطة = ${r.dzd} دج · ${r.account||''} · ${fmtDate(r.date)} ${fmtTime(r.date)}</div>
        </div>
        ${r.status==='pending'? `
          <div style="display:flex;gap:8px;">
            <button class="mini-btn ok" data-approve="${r.id}">${icon('check',13)} موافقة</button>
            <button class="mini-btn bad" data-reject="${r.id}">${icon('x',13)} رفض</button>
          </div>` : `<span class="badge ${r.status==='approved'?'ok':'bad'}">${r.status==='approved'? icon('check',12)+' تمت الموافقة' : icon('x',12)+' مرفوض'}</span>`}
      </div>`).join('')}
  </div>`;
}
function renderAdminUsers(list){
  if(list.length===0) return '<div class="empty">لا يوجد مستخدمون بعد</div>';
  return `<div class="section-lbl">المستخدمون</div><div class="req-list">
    ${list.map(u=>`
      <div class="req-item">
        <div><div class="req-name">${u.name} — ${u.email}</div><div class="req-meta">انضم في ${fmtDate(u.joinedAt)} ${u.blocked? '· موقوف':''}</div></div>
        <div class="disp" style="font-weight:800;">${u.points} نقطة</div>
        ${u.blocked
          ? `<button class="mini-btn ok" data-unblock="${u.id}">${icon('check',13)} إلغاء الإيقاف</button>`
          : `<button class="mini-btn bad" data-block="${u.id}">${icon('x',13)} إيقاف</button>`}
      </div>`).join('')}
  </div>`;
}
function renderAdminRules(rules, audit){
  return `
    <div class="section-lbl">كلمات ممنوعة (قمار / +18)</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="r-pattern" placeholder="كلمة ممنوعة مثل: رهان" style="flex:1;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;">
      <select id="r-category" style="padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;">
        <option value="gambling">قمار</option>
        <option value="adult">+18</option>
      </select>
      <button class="mini-btn ok" id="r-add">${icon('check',13)} إضافة</button>
    </div>
    <div class="req-list">
      ${rules.map(r=>`
        <div class="req-item">
          <div><div class="req-name">${r.pattern}</div><div class="req-meta">${r.category==='gambling'?'قمار':'محتوى +18'}</div></div>
          <button class="mini-btn bad" data-delrule="${r.id}">${icon('x',13)} حذف</button>
        </div>`).join('')}
    </div>
    <div class="section-lbl" style="margin-top:20px;">سجل التدقيق (Audit Log)</div>
    <div class="req-list">
      ${audit.length===0? '<div class="empty">لا يوجد نشاط</div>' : audit.map(l=>`
        <div class="req-item"><div class="req-name">${l.action}</div><div class="req-meta">${l.detail||''} · ${fmtDate(l.date)} ${fmtTime(l.date)}</div></div>`).join('')}
    </div>`;
}
function attachAdminEvents(){
  document.getElementById('admin-logout').onclick = ()=>{ state.screen='auth'; state.adminData=null; render(); };
  document.querySelectorAll('[data-atab]').forEach(t=>{ t.onclick = ()=>{ adminTab = t.dataset.atab; render(); }; });
  document.querySelectorAll('[data-approve]').forEach(b=>{
    b.onclick = async ()=>{
      try{ await api(`/admin/withdrawals/${b.dataset.approve}/approve`, { method:'POST' }); await loadAdmin(); }
      catch(e){ handleApiErr(e); }
    };
  });
  document.querySelectorAll('[data-reject]').forEach(b=>{
    b.onclick = async ()=>{
      try{ await api(`/admin/withdrawals/${b.dataset.reject}/reject`, { method:'POST' }); await loadAdmin(); }
      catch(e){ handleApiErr(e); }
    };
  });
  document.querySelectorAll('[data-block]').forEach(b=>{
    b.onclick = async ()=>{
      try{ await api(`/admin/users/${b.dataset.block}/block`, { method:'POST' }); await loadAdmin(); }
      catch(e){ handleApiErr(e); }
    };
  });
  document.querySelectorAll('[data-unblock]').forEach(b=>{
    b.onclick = async ()=>{
      try{ await api(`/admin/users/${b.dataset.unblock}/unblock`, { method:'POST' }); await loadAdmin(); }
      catch(e){ handleApiErr(e); }
    };
  });
  const addBtn = document.getElementById('r-add');
  if(addBtn) addBtn.onclick = async ()=>{
    const pattern = document.getElementById('r-pattern').value.trim();
    const category = document.getElementById('r-category').value;
    if(!pattern) return;
    try{ await api('/admin/filterRules', { method:'POST', body: JSON.stringify({ pattern, category }) }); await loadAdmin(); }
    catch(e){ handleApiErr(e); }
  };
  document.querySelectorAll('[data-delrule]').forEach(b=>{
    b.onclick = async ()=>{
      try{ await api(`/admin/filterRules/${b.dataset.delrule}`, { method:'DELETE' }); await loadAdmin(); }
      catch(e){ handleApiErr(e); }
    };
  });
}

(async function init(){
  // Wake the free cloud server (Render sleeps after idle)
  try{ fetch(API_BASE.replace('/api','')+'/health'); }catch(e){}
  render();
  if(authToken && state.screen==='auth'){
    try{
      const data = await api('/user/me');
      state.user = data.user;
      state.transactions = data.transactions;
      state.screen = data.user.email===ADMIN_EMAIL ? 'admin' : 'auth';
      if(data.user.email===ADMIN_EMAIL) await loadAdmin();
      else render();
    }catch(e){ /* token expired or invalid */ }
  }
  state.loading = false;
  render();
})();
</script>
